<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的学习计划</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="workspace">
    <header class="page-header">
      <span class="lesson">第七课 · 备份任务</span>
      <!-- h1 是页面的主标题。试着把它改成你自己的标题。 -->
      <h1>我的任务清单</h1>
      <p class="intro">从一件小事开始，慢慢把想法变成现实。</p>
    </header>

    <section class="task-card" aria-labelledby="list-title">
      <div class="card-heading">
        <h2 id="list-title">今天想完成什么？</h2>
        <span class="status">可以备份了</span>
      </div>

      <!-- label 的 for 与 input 的 id 相同，表示它们是一组。 -->
      <form id="task-form">
      <label for="task-input">新任务</label>
      <div class="input-row">
        <input id="task-input" type="text" maxlength="100"
               placeholder="例如：学习如何做前端网页"
               aria-describedby="input-hint">
        <button type="submit">添加任务</button>
      </div>
      <p id="input-hint" class="hint">输入任务后点击添加，或直接按回车。任务只保存在当前浏览器，不会跨设备同步。</p>
  
      </form>
      <p id="storage-status" class="hint" role="status">添加、勾选或删除任务后，会自动保存到当前浏览器。</p>
      <p id="feedback" class="hint" role="status" aria-live="polite"></p>
      <div class="filter-bar" role="group" aria-label="筛选任务">
        <button type="button" class="filter-button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" class="filter-button" data-filter="active" aria-pressed="false">未完成</button>
        <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>
      <div class="backup-bar" role="group" aria-label="任务备份">
        <button id="export-button" type="button" class="backup-button">导出备份</button>
        <button id="import-button" type="button" class="backup-button">导入备份</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p class="hint">备份文件包含所有任务和完成状态；导入将替换当前清单。</p>
      <section id="import-confirmation" class="import-confirmation" aria-labelledby="import-title" hidden>
        <h3 id="import-title">确认恢复备份</h3>
        <p id="import-description"></p>
        <div class="backup-bar">
          <button id="confirm-import" type="button">确认替换</button>
          <button id="cancel-import" type="button" class="backup-button">取消导入</button>
        </div>
      </section>
      <p id="filter-summary" class="hint"></p>
      <ul id="task-list" class="task-list" aria-label="任务列表" hidden></ul>

      <div id="empty-state" class="empty-state">
        <span class="empty-mark" aria-hidden="true">✓</span>
        <h3 id="empty-title">清单，准备好了</h3>
        <p id="empty-description">写下第一件想做的小事，它就会出现在这里。</p>
      </div>
    </section>

    <footer>今天的小目标：导出独立备份文件，再从文件恢复任务。</footer>
  </main>
  <!-- defer 表示等 HTML 解析完成后，再执行 JavaScript。 -->
  <script src="app.js" defer></script>
</body>
</html>
